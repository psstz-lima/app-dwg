name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes do leitor LandXML
        run: ./gradlew -p core test

      # Only checks that the app compiles; the APK for the phone is built locally.
      - name: Compilar o app
        run: ./gradlew :app:assembleDebug
