name: Play Store

# Builds the unsigned release bundle (AAB) for Google Play, with the R8 mapping file. The upload key
# never comes to GitHub: the bundle is signed afterwards with jarsigner on the developer's machine.
on:
  push:
    branches: ["play/**", "claude/project-thread-fn1tme"]
  workflow_dispatch:

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar AAB de release
        run: ./gradlew :app:bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: gromatic-release-unsigned
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/mapping/release/mapping.txt
