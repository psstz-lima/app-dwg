name: Release

# Builds the installable APK when a release/<version> branch is pushed (for example release/v0.1.0);
# pull requests just run the checks in build.yml.
on:
  push:
    branches: ["release/**"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Gerar APK
        run: |
          ./gradlew :app:assembleDebug
          echo "VERSION=${GITHUB_REF_NAME#release/}" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/debug/app-debug.apk "app-dwg-${GITHUB_REF_NAME#release/}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: app-dwg-${{ env.VERSION }}.apk
          prerelease: true
